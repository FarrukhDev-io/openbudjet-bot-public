# FIX (Roast R4): PgBouncer Configuration (Transaction Pooling Mode)
# Multi-worker deploymentlarda PostgreSQL ulanishlar limitidan oshib ketmaslik uchun
# PgBouncer o'rnatilishi va ulanishlar uning porti orqali yo'naltirilishi lozim.

[databases]
# openbudget ma'lumotlar bazasini real PostgreSQL serveriga yo'naltirish
openbudget = host=127.0.0.1 port=5432 dbname=openbudget

[pgbouncer]
listen_port = 6432
listen_addr = *

# Autentifikatsiya sozlamalari
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Ma'murlar va monitoring foydalanuvchilari
admin_users = postgres
stats_users = postgres

# Ulanishlar rejimi: TRANSACTION POOLING (Enterprise default for high-concurrency stateless backends)
# PostgreSQL serveridagi real connectionlarni tejash va qisqa vaqt ichida ko'p so'rovlarni bajarish imkoni beradi.
pool_mode = transaction

# Ulanishlar limitlari
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

# Ulanishlarni boshqarish parametrlari
query_timeout = 10
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 120
